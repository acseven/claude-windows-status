name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release (version YYYY.M.number, number = next free for this month)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Versions are YYYY.M.number (e.g. 2026.10.1). MSI versions cannot have a major part above 255,
  # so the installer's ProductVersion is YY.M.number (26.10.1); upgrades still compare correctly.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      msi: ${{ steps.v.outputs.msi }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          y=$(date -u +%Y); m=$(date -u +%-m)
          last=$(git tag -l "v$y.$m.*" | sed "s/^v$y\.$m\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release }}" = "true" ]; then
            n=$(( ${last:-0} + 1 ))
          else
            n=0   # CI builds are YYYY.M.0
          fi
          echo "version=$y.$m.$n" >> "$GITHUB_OUTPUT"
          echo "msi=$((y - 2000)).$m.$n" >> "$GITHUB_OUTPUT"
          echo "Version $y.$m.$n (MSI $((y - 2000)).$m.$n)"

  build:
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish app (self-contained single file)
        run: >
          dotnet publish src/ClaudeStatus -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -p:DebugType=none
          -p:Version=${{ needs.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Build MSI
        run: >
          dotnet build installer -c Release
          -p:Platform=${{ matrix.platform }}
          -p:PublishDir=${{ github.workspace }}/publish/${{ matrix.rid }}
          -p:Version=${{ needs.version.outputs.msi }}
          -p:DisplayVersion=${{ needs.version.outputs.version }}

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item publish/${{ matrix.rid }}/ClaudeStatus.exe dist/ClaudeStatus-${{ needs.version.outputs.version }}-${{ matrix.rid }}.exe
          Get-ChildItem installer/bin -Recurse -Filter *.msi | Copy-Item -Destination dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeStatus-${{ matrix.rid }}
          path: dist/*

  # Runs the real app on hosted Windows desktops and keeps screenshots:
  # windows-2022 has the Windows 10 shell, windows-2025 the Windows 11 shell.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            prefix: win10
          - os: windows-2025
            prefix: win11
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ClaudeStatus-win-x64
          path: dist
      - name: Run and capture
        shell: pwsh
        run: ./.github/scripts/smoke.ps1 -Exe (Get-ChildItem dist/ClaudeStatus-*-win-x64.exe).FullName -OutDir screenshots -Prefix ${{ matrix.prefix }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.prefix }}
          path: screenshots/*

  # Only when started by hand: Actions → build → Run workflow → "Publish a release".
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [version, build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ClaudeStatus-*
          path: dist
          merge-multiple: true
      - name: Package policy templates
        run: zip -r dist/ClaudeStatus-${{ needs.version.outputs.version }}-PolicyDefinitions.zip policy
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Claude Status ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
