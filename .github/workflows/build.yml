name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.1.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish app (self-contained single file)
        run: >
          dotnet publish src/ClaudeStatus -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Build MSI
        run: >
          dotnet build installer -c Release
          -p:Platform=${{ matrix.platform }}
          -p:PublishDir=${{ github.workspace }}/publish/${{ matrix.rid }}
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item publish/${{ matrix.rid }}/ClaudeStatus.exe dist/ClaudeStatus-${{ matrix.rid }}.exe
          Get-ChildItem installer/bin -Recurse -Filter *.msi | Copy-Item -Destination dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeStatus-${{ matrix.rid }}
          path: dist/*

  # Runs the real app on hosted Windows desktops and keeps screenshots:
  # windows-2022 has the Windows 10 shell, windows-2025 the Windows 11 shell.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            prefix: win10
          - os: windows-2025
            prefix: win11
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ClaudeStatus-win-x64
          path: dist
      - name: Run and capture
        shell: pwsh
        run: ./.github/scripts/smoke.ps1 -Exe dist/ClaudeStatus-win-x64.exe -OutDir screenshots -Prefix ${{ matrix.prefix }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.prefix }}
          path: screenshots/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Package policy templates
        run: zip -r dist/ClaudeStatus-PolicyDefinitions.zip policy
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
