name: build

on:
  push:
    branches: ['**']
    tags: ['v*']   # pushing vYYYY.M.N publishes that version as a pre-release
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release (version YYYY.M.number, number = next free for this month)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Versions are YYYY.M.number (e.g. 2026.10.1). MSI versions cannot have a major part above 255,
  # so the installer's ProductVersion is YY.M.number (26.10.1); upgrades still compare correctly.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      msi: ${{ steps.v.outputs.msi }}
      release: ${{ steps.v.outputs.release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            [[ "$v" =~ ^(20[0-9]{2})\.([1-9]|1[0-2])\.([0-9]+)$ ]] || { echo "Tag must be vYYYY.M.N, got $GITHUB_REF_NAME"; exit 1; }
            y=${BASH_REMATCH[1]}; m=${BASH_REMATCH[2]}; n=${BASH_REMATCH[3]}
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "msi=$((y - 2000)).$m.$n" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Version $v from tag"
            exit 0
          fi
          y=$(date -u +%Y); m=$(date -u +%-m)
          last=$(git tag -l "v$y.$m.*" | sed "s/^v$y\.$m\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          release=false; prerelease=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release }}" = "true" ]; then
            release=true
          elif [ "${{ github.event_name }}" = "push" ] && grep -qF '[release]' <<< "$COMMIT_MESSAGE"; then
            release=true; prerelease=true   # test build requested from a commit message
          fi
          if [ "$release" = true ]; then n=$(( ${last:-0} + 1 )); else n=0; fi   # CI builds are YYYY.M.0
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$y.$m.$n" >> "$GITHUB_OUTPUT"
          echo "msi=$((y - 2000)).$m.$n" >> "$GITHUB_OUTPUT"
          echo "Version $y.$m.$n (MSI $((y - 2000)).$m.$n)"

  # Mechanical part of the GPO check required by CLAUDE.md (definitions vs code, valid files).
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check_policy.py

  build:
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish app (self-contained single file)
        run: >
          dotnet publish src/ClaudeStatus -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -p:DebugType=none
          -p:Version=${{ needs.version.outputs.version }}
          -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}
          -o publish/${{ matrix.rid }}

      - name: Build MSI
        run: >
          dotnet build installer -c Release
          -p:Platform=${{ matrix.platform }}
          -p:PublishDir=${{ github.workspace }}/publish/${{ matrix.rid }}
          -p:Version=${{ needs.version.outputs.msi }}
          -p:DisplayVersion=${{ needs.version.outputs.version }}

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item publish/${{ matrix.rid }}/ClaudeStatus.exe dist/ClaudeStatus-${{ needs.version.outputs.version }}-${{ matrix.rid }}-portable.exe
          Get-ChildItem installer/bin -Recurse -Filter *.msi | Copy-Item -Destination dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeStatus-${{ matrix.rid }}
          path: dist/*

  # Runs the real app on hosted Windows desktops and keeps screenshots:
  # windows-2022 has the Windows 10 shell, windows-2025 the Windows 11 shell.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            prefix: win10
          - os: windows-2025
            prefix: win11
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ClaudeStatus-win-x64
          path: dist
      - name: Run and capture
        shell: pwsh
        run: ./.github/scripts/smoke.ps1 -Exe (Get-ChildItem dist/ClaudeStatus-*-win-x64-portable.exe).FullName -Msi (Get-ChildItem dist/ClaudeStatus-*-x64-setup.msi).FullName -OutDir screenshots -Prefix ${{ matrix.prefix }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.prefix }}
          path: screenshots/*

  # Publishes the latest smoke screenshots to the orphan branch "ci-screenshots" (force-pushed),
  # so they can be reviewed and copied into docs/images without downloading artifacts.
  screenshots:
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: shots
          merge-multiple: true
      - name: Push to ci-screenshots branch
        run: |
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Smoke-test screenshots from ${GITHUB_SHA} (${GITHUB_REF_NAME})." > README.md
          git add -A
          git commit -qm "Smoke screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

  # Only on purpose: Actions → build → Run workflow → "Publish a release" (full release),
  # or a pre-release for testing: push a vYYYY.M.N tag, or a commit whose message contains [release].
  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, policy-check, build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ClaudeStatus-*
          path: dist
          merge-multiple: true
      - name: Package policy templates
        run: zip -r dist/ClaudeStatus-${{ needs.version.outputs.version }}-PolicyDefinitions.zip policy
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Claude Status ${{ needs.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: dist/*
